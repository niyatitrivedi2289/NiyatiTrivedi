<!DOCTYPE html>
<!-- @dsCard group="Brand" name="CardioNexion 2025 Case Study" subtitle="@-HEALTH cardiac app reimagined for 2025" -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CardioNexion 2025 — @-HEALTH redesign case study</title>
<link rel="stylesheet" href="/casestudy/health/tokens.css" />
<template id="__bundler_thumbnail">
  <div style="width:100%;height:100%;background:linear-gradient(160deg,#0B3940,#0E6E78);display:flex;align-items:center;justify-content:center;">
    <svg viewBox="0 0 100 100" width="40%" height="40%" fill="none" stroke="#2BC0CB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 52 H30 L38 30 L50 70 L60 46 L66 52 H94" />
    </svg>
  </div>
</template>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  .cs-navlinks a:hover { color: var(--brand-600) !important; }
  .cs-herochip { position: absolute; left: -9%; bottom: 4%; transform: rotate(-5deg); }
  /* hardware showcase */
  .cs-fcard:hover { border-color: rgba(43,192,203,.45) !important; transform: translateY(-4px); }
  @media (max-width: 1080px) {
    .cs-hwhero, .cs-sensehero, .cs-explode, .cs-vest { grid-template-columns: 1fr !important; }
    .cs-feat-grid { grid-template-columns: 1fr 1fr !important; }
    .cs-certstrip { grid-template-columns: 1fr 1fr !important; gap: 32px !important; }
  }
  @media (max-width: 600px) {
    .cs-feat-grid, .cs-certstrip, .cs-specgrid { grid-template-columns: 1fr !important; }
    .cs-shot { max-height: 380px !important; }
  }
  /* responsive collapses */
  @media (max-width: 1080px) {
    .cs-herochip { left: 5%; bottom: 2%; transform: rotate(-4deg); }
    .cs-hero, .cs-2up, .cs-feat, .cs-critique { grid-template-columns: 1fr !important; }
    .cs-3up { grid-template-columns: 1fr 1fr !important; }
    .cs-4up { grid-template-columns: 1fr 1fr !important; }
    .cs-feat > div:first-child, .cs-critique > div:first-child { order: 0 !important; }
  }
  @media (max-width: 720px) {
    .cs-navlinks a { display: none; }
    .cs-3up, .cs-4up, .cs-cf { grid-template-columns: 1fr !important; }
    .cs-critique { grid-template-columns: 1fr !important; }
  }

  /* next-case footer */
  .hx-next{border-top:1px solid var(--c-hairline);background:var(--c-bg,#fff);padding:64px 0}
  .hx-next a{display:flex;align-items:center;justify-content:space-between;gap:28px;max-width:1160px;margin:0 auto;padding:0 clamp(20px,4vw,48px);text-decoration:none;color:var(--c-ink)}
  .hx-k{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink-2);margin-bottom:10px}
  .hx-t{font-size:clamp(22px,3vw,34px);font-weight:800;letter-spacing:-.025em;line-height:1.12}
  .hx-d{font-size:14.5px;line-height:1.6;color:var(--c-ink-2);margin-top:10px;max-width:620px;text-wrap:pretty}
  .hx-a{flex:none;width:50px;height:50px;border-radius:50%;border:1px solid var(--c-hairline);display:grid;place-items:center;transition:background .2s,color .2s,transform .3s cubic-bezier(.22,1.3,.36,1)}
  .hx-next a:hover .hx-a{background:var(--brand-700);color:#fff;border-color:var(--brand-700);transform:translateX(5px)}
  @media(max-width:640px){.hx-next a{flex-direction:column;align-items:flex-start;gap:20px}}
</style>
</head>
<body>
<div id="content"></div>
<div id="tweaks"></div>
<section class="hx-next">
  <a href="/casestudy/fis/index.html">
    <div>
      <div class="hx-k">Next case study</div>
      <div class="hx-t">FIS Developer Experience</div>
      <div class="hx-d">Client work · 2019—2023 · Merging two developer portals, and a dozen products, into one platform — with five live prototype screens you can click through.</div>
    </div>
    <span class="hx-a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
  </a>
</section>


<script src="/casestudy/health/build/app.bundle.js"></script>
<script data-cs="health" data-note="I worked on the original version of this product in 2017 and always felt we’d left patients to read their own ECGs alone. This is my attempt at the version I wish we’d shipped. If you work in health, I’d love to hear where I’ve got it wrong." src="/casestudy/portfolio-bar.js" data-home="/index.html" data-resume="/uploads/Niyati-Trivedi-Resume.pdf"></script>
</body>
</html>
